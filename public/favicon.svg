<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c97a"/>
      <stop offset="50%" stop-color="#D4B483"/>
      <stop offset="100%" stop-color="#a87d3a"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7f0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Fundo circular branco suave -->
  <circle cx="50" cy="50" r="49" fill="url(#bgGrad)" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Folha grande esquerda superior (espiral) -->
  <path d="M18 38 C12 20 28 8 42 14 C35 22 30 32 34 44 C28 42 22 40 18 38 Z" fill="#2E7D32"/>
  <!-- nervuras -->
  <path d="M18 38 C25 28 33 20 42 14" stroke="#4CAF50" stroke-width="0.9" fill="none" opacity="0.7"/>
  <path d="M22 33 C27 28 32 22 38 17" stroke="#81C784" stroke-width="0.6" fill="none" opacity="0.5"/>
  <path d="M20 38 C26 33 30 27 36 21" stroke="#81C784" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- Folha grande direita superior -->
  <path d="M82 38 C88 20 72 8 58 14 C65 22 70 32 66 44 C72 42 78 40 82 38 Z" fill="#2E7D32"/>
  <path d="M82 38 C75 28 67 20 58 14" stroke="#4CAF50" stroke-width="0.9" fill="none" opacity="0.7"/>
  <path d="M78 33 C73 28 68 22 62 17" stroke="#81C784" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- Folha esquerda inferior (espiral base) -->
  <path d="M22 62 C10 72 14 88 28 90 C28 80 30 70 38 64 C32 64 27 63 22 62 Z" fill="#388E3C"/>
  <path d="M22 62 C26 70 28 80 28 90" stroke="#4CAF50" stroke-width="0.9" fill="none" opacity="0.7"/>

  <!-- Folha direita inferior -->
  <path d="M78 62 C90 72 86 88 72 90 C72 80 70 70 62 64 C68 64 73 63 78 62 Z" fill="#388E3C"/>
  <path d="M78 62 C74 70 72 80 72 90" stroke="#4CAF50" stroke-width="0.9" fill="none" opacity="0.7"/>

  <!-- Folha pequena dourada inferior centro -->
  <path d="M50 84 C44 76 43 68 50 62 C57 68 56 76 50 84 Z" fill="#D4B483"/>
  <path d="M50 84 C50 76 50 68 50 62" stroke="#a87d3a" stroke-width="0.8" fill="none" opacity="0.8"/>

  <!-- Pequeno círculo topo direito (detalhe do logo) -->
  <circle cx="74" cy="18" r="5" fill="none" stroke="#D4B483" stroke-width="1.5"/>
  <circle cx="74" cy="18" r="2.5" fill="#D4B483"/>

  <!-- Cruz central dourada -->
  <rect x="44" y="30" width="12" height="40" rx="3" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <rect x="30" y="44" width="40" height="12" rx="3" fill="url(#goldGrad)" filter="url(#shadow)"/>
</svg>