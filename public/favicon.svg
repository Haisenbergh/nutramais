<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente dourado metálico para a cruz e a folha dourada -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="30%" stop-color="#D4B483" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    
    <!-- Gradiente verde escuro para as folhas externas -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="50%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    
    <!-- Gradiente verde claro para a folha do topo direito -->
    <linearGradient id="lightGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>

    <!-- Filtro de sombra suave -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Coroa de Folhas Verdes Externa (Círculo de folhas) -->
  <!-- Folha 1 (Esquerda/Superior): curva do topo até a base esquerda -->
  <path d="M 256 32 C 160 32 64 96 48 200 C 32 304 96 416 192 464 C 180 430 180 370 200 320 C 140 330 90 280 80 220 C 70 160 110 100 180 70 C 210 58 240 50 256 32 Z" fill="url(#greenGrad)" />
  
  <!-- Folha 2 (Direita/Inferior): curva da base até o topo direito -->
  <path d="M 256 480 C 352 480 448 416 464 312 C 480 208 416 96 320 48 C 332 82 332 142 312 192 C 372 182 422 232 432 292 C 442 352 402 412 333 442 C 303 454 272 462 256 480 Z" fill="url(#greenGrad)" />
  
  <!-- Detalhes das nervuras das folhas externas (linhas mais claras) -->
  <path d="M 256 32 C 180 60 110 130 80 220" stroke="#81C784" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 170 85 C 130 115 105 160 95 210" stroke="#81C784" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 200 130 C 170 160 150 200 140 240" stroke="#81C784" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5" />
  
  <path d="M 256 480 C 332 452 402 382 432 292" stroke="#81C784" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 342 427 C 382 397 407 352 417 302" stroke="#81C784" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 312 382 C 342 352 362 312 372 272" stroke="#81C784" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Cruz Dourada Central com Cantos Arredondados -->
  <g filter="url(#dropShadow)">
    <rect x="226" y="156" width="60" height="200" rx="20" fill="url(#goldGrad)" />
    <rect x="156" y="226" width="200" height="60" rx="20" fill="url(#goldGrad)" />
  </g>
  
  <!-- Pequeno círculo no topo direito com folhinha verde -->
  <g transform="translate(370, 80)" filter="url(#dropShadow)">
    <!-- Círculo Dourado -->
    <circle cx="25" cy="25" r="25" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
    <circle cx="25" cy="25" r="10" fill="url(#goldGrad)" opacity="0.2" />
    <!-- Pequena Folha Verde dentro -->
    <path d="M 25 10 C 32 15 35 23 25 35 C 15 23 18 15 25 10 Z" fill="url(#lightGreenGrad)" />
    <path d="M 25 10 L 25 30" stroke="#1B5E20" stroke-width="1.5" fill="none" />
  </g>

  <!-- Folha Dourada no Canto Inferior Direito -->
  <g transform="translate(290, 310)" filter="url(#dropShadow)">
    <!-- Corpo da folha dourada -->
    <path d="M 10 100 C 50 100 90 70 100 10 C 70 40 40 50 10 100 Z" fill="url(#goldGrad)" />
    <!-- Nervura central da folha dourada -->
    <path d="M 10 100 C 40 70 70 45 100 10" stroke="#996515" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 40 70 C 50 55 65 50 75 45" stroke="#996515" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M 28 82 C 38 72 50 70 60 68" stroke="#996515" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>
</svg>